# Kein datasource-Block: die Verbindungsdaten liefert der PostgreSQL-Testcontainer
# (siehe PostgresTestcontainerConfiguration).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/schema

pizzashop:
  admin:
    # Blank so tests control the allowlist themselves rather than inheriting a bootstrap admin.
    bootstrap-email: ""
  frontend-url: http://localhost:4200
