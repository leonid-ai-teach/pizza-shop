spring:
  datasource:
    url: jdbc:h2:mem:pizzashop-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/schema

pizzashop:
  admin:
    # Blank so tests control the allowlist themselves rather than inheriting a bootstrap admin.
    bootstrap-email: ""
  frontend-url: http://localhost:4200
