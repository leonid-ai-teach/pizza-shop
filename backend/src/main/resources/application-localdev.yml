spring:
  datasource:
    url: jdbc:h2:mem:pizzashop-localdev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

pizzashop:
  admin:
    # Known credentials so the admin area can be opened right after "./mvnw spring-boot:run
    # -Plocaldev" without any setup. Safe to have in the repository: this profile runs against an
    # in-memory database and is never active in a deployed environment.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:dev-admin@pizzashop.local}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:localdev-passwort}
