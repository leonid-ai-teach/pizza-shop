spring:
  application:
    name: pizza-shop-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pizzashop}
    username: ${SPRING_DATASOURCE_USERNAME:pizzashop}
    password: ${SPRING_DATASOURCE_PASSWORD:pizzashop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/schema,classpath:db/migration/seed

pizzashop:
  admin:
    # The first admin, created at startup if absent. Both values are needed; an admin row
    # without a password can never sign in (docs/adr/0003-admin-password-auth.md).
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  # Where the SPA lives; used for CORS. Only relevant when the SPA is served from a different
  # origin than the API, i.e. the Angular dev server.
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
