# Rollt das Backend nach Cloud Run und das Frontend nach Firebase Hosting aus.
#
# Bewusst getrennt von ci-cd.yml (der Weg zu Oracle Cloud) und bewusst nur manuell ausloesbar:
# solange nicht klar ist, welcher der beiden Wege dauerhaft genutzt wird, soll kein Push
# automatisch beide Ziele gleichzeitig bespielen. Tests laufen hier nicht erneut - ci-cd.yml
# prueft jeden Push bereits; dieser Workflow setzt voraus, dass der auszurollende Commit dort
# gruen war.
#
# Was vorher eingerichtet sein muss (Neon, GCP-Projekt, Firebase, Secrets): docs/deployment-cloudrun.md
name: Deploy Cloud Run

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  REGION: europe-west3
  REPOSITORY: pizza-shop
  SERVICE: pizza-shop-backend

jobs:
  deploy-backend:
    name: Backend nach Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker fuer Artifact Registry einrichten
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Bildnamen bestimmen
        id: image
        run: echo "name=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=cloudrun-backend
          cache-to: type=gha,mode=max,scope=cloudrun-backend

      - name: Nach Cloud Run ausrollen
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.image.outputs.name }}
          # Spring haelt die Sitzung nur im Arbeitsspeicher der jeweiligen Instanz (keine
          # geteilte Session-Datenbank). --session-affinity allein reicht nicht: Firebase
          # Hosting reicht sein Routing-Cookie beim Weiterleiten an Cloud Run nicht zuverlaessig
          # durch (verifiziert - direkt gegen Cloud Run funktioniert Affinity einwandfrei, ueber
          # die Firebase-Hosting-Rewrite nicht). Deshalb zusaetzlich --max-instances=1: bei der
          # Groesse dieser App unproblematisch, und es gibt dann schlicht keine "falsche"
          # Instanz mehr, an die eine Folgeanfrage geroutet werden koennte.
          flags: --allow-unauthenticated --port=8080 --session-affinity --max-instances=1
          env_vars: |-
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            ADMIN_BOOTSTRAP_EMAIL=${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
            ADMIN_BOOTSTRAP_PASSWORD=${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            SERVER_FORWARD_HEADERS_STRATEGY=native

  deploy-frontend:
    name: Frontend nach Firebase Hosting
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci und Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
