@if (showShopHeader()) {
  <header class="kopf">
    <div class="kopf-inhalt">
      <a routerLink="/" class="marke-name">Pizza&nbsp;Shop</a>

      <nav aria-label="Hauptnavigation">
        <a routerLink="/" routerLinkActive="aktiv" [routerLinkActiveOptions]="{ exact: true }"
          >Speisekarte</a
        >
        <a routerLink="/cart" routerLinkActive="aktiv" class="warenkorb">
          Warenkorb
          <span class="zaehler zahl" [class.gefuellt]="cartItemCount() > 0">{{
            cartItemCount()
          }}</span>
        </a>
      </nav>
    </div>
  </header>
}

<main [class.verwaltung]="!showShopHeader()">
  <router-outlet />
</main>
