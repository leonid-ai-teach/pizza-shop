<section class="tor">
  <p class="marke">Pizza Shop &middot; Verwaltung</p>
  <h1>Anmeldung</h1>

  @if (loginFailed()) {
    <p class="meldung-fehler" role="alert" data-testid="login-error">
      Anmeldung fehlgeschlagen. Bitte E-Mail-Adresse und Passwort prüfen.
    </p>
  }

  <p class="anriss">
    Der Zugang steht nur eingeladenen Personen offen. Ein vorhandener Admin muss dich vorher
    anlegen.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="feld">
      <span>E-Mail-Adresse</span>
      <input type="email" formControlName="email" autocomplete="username" data-testid="login-email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="feld-fehler">Bitte eine gültige E-Mail-Adresse eingeben.</small>
      }
    </label>

    <label class="feld">
      <span>Passwort</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        data-testid="login-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="feld-fehler">Bitte das Passwort eingeben.</small>
      }
    </label>

    <button type="submit" class="knopf" data-testid="login-submit">Anmelden</button>
  </form>
</section>
