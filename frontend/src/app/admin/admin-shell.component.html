<header class="leiste">
  <p class="ort">
    <span class="ort-marke">Pizza&nbsp;Shop</span>
    <span class="ort-teil">Verwaltung</span>
  </p>
  <div class="kennung">
    @if (adminEmail(); as email) {
      <span class="konto" data-testid="admin-email">{{ email }}</span>
    }
    <button type="button" class="abmelden" data-testid="logout" (click)="logout()">Abmelden</button>
  </div>
</header>

<nav class="reiter" aria-label="Verwaltung">
  <a routerLink="/admin" routerLinkActive="aktiv" [routerLinkActiveOptions]="{ exact: true }"
    >Übersicht</a
  >
  <a routerLink="/admin/orders" routerLinkActive="aktiv">Bestellungen</a>
  <a routerLink="/admin/pizzas" routerLinkActive="aktiv">Pizzen</a>
  <a routerLink="/admin/toppings" routerLinkActive="aktiv">Toppings</a>
  <a routerLink="/admin/admins" routerLinkActive="aktiv">Admins</a>
</nav>

<router-outlet />
