# Das Protokoll, das der Browser gesprochen hat. Direkt am nginx ist das $scheme; steht davor
# ein TLS-Terminator (im Produktionsbetrieb der Caddy, siehe docs/deployment/deployment-oracle-inaktiv.md), dann sagt es
# dessen X-Forwarded-Proto. Der Wert muss unveraendert durchgereicht werden: Spring markiert
# Sitzungs- und XSRF-Cookie nur dann als "Secure", wenn es den Request als sicher erkennt.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Alles, was zum Backend gehoert. SPA und API liegen dadurch auf demselben Origin:
    # CORS entfaellt und das XSRF-TOKEN-Cookie passt ohne Sonderregel.
    location ~ ^/api(/|$) {
        proxy_pass http://backend:8080;

        # $http_host, nicht $host: $host verliert den Port. Spring baut absolute URLs sonst
        # gegen http://localhost/ statt http://localhost:8080/.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # Die Build-Artefakte tragen einen Hash im Namen und duerfen deshalb lange liegen bleiben.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Die index.html dagegen nie cachen, sonst zeigt der Browser nach einem Deploy weiter auf
    # Asset-Namen, die es nicht mehr gibt.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular-Routing: unbekannte Pfade gehoeren der SPA, nicht dem Dateisystem.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
